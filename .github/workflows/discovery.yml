name: Discover official series and films
on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-catalog
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate discovery rules
        run: python -m unittest discover -s tests -p test_*.py -v
      - name: Discover verified full content
        run: python -m tools.auto_discovery
      - name: Record scan results
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add schedules/followed-series.json schedules/series-artwork.json public-updates
          if ! git diff --cached --quiet; then
            git commit -m "Discover and validate official full series and films"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-updates
      - name: Publish validated catalog
        id: deployment
        uses: actions/deploy-pages@v4
