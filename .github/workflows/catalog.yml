name: Series catalog - every 15 minutes
on:
  push:
    paths:
      - OzturkIPTV-bulut-katalog.zip
      - 'tools/**'
      - 'schedules/**'
      - .github/workflows/catalog.yml
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh official sources before publishing
        type: boolean
        default: true
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand reviewed public catalog bundle
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root = Path.cwd().resolve()
          with zipfile.ZipFile('OzturkIPTV-bulut-katalog.zip') as bundle:
              for item in bundle.infolist():
                  name = item.filename
                  if not (name.startswith(('tools/', 'schedules/', 'public-updates/')) or name == 'requirements.txt'):
                      continue
                  target = (root / name).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe bundle path')
                  if not target.exists() and not item.is_dir():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(bundle.read(item))
      - run: python -m pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - name: Refresh official public metadata
        id: refresh
        if: github.event_name != 'workflow_dispatch' || inputs.refresh == true
        continue-on-error: true
        run: python -m tools.cloud_series_refresh
      - name: Preserve public catalog and updater
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add tools/*.py schedules/*.json public-updates requirements.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official episode and upcoming trailer catalog"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-updates
      - name: Publish public JSON catalog
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report provider outage
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Official metadata refresh failed. Last verified catalog remains published."
          exit 1
