<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Öztürk İPTV YouTube oynatıcı</title>
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#message{color:#fff;font:20px Arial;padding:24px}iframe{border:0}</style></head><body><div id="player"></div><p id="message" hidden></p>
<script>
(function(){
 'use strict';
 var p=new URLSearchParams(location.hash.slice(1)),id=p.get('video'),session=p.get('session'),live=p.get('live')==='1',paused=p.get('paused')==='1',player,ready=false,timer;
 function validId(value){return typeof value==='string'&&/^[\w-]{11}$/.test(value);}
 function send(event,fields){if(parent!==window)parent.postMessage(Object.assign({type:'ozturk-youtube-event',session:session,event:event},fields||{}),'*');}
 if(!validId(id)||!session||session.length>200){var message=document.getElementById('message');message.hidden=false;message.textContent='Bu oynatıcı Öztürk İPTV uygulamasından açılır.';return;}
 function captions(){try{if(player&&player.getOptions().indexOf('captions')>=0)player.unloadModule('captions');}catch(ignore){}}
 function tick(){if(!player||!ready)return;try{send('time',{position:player.getCurrentTime(),duration:player.getDuration()});}catch(ignore){}}
 window.addEventListener('message',function(event){
  var m=event.data;
  if(event.source!==parent||!m||m.type!=='ozturk-youtube-command'||m.session!==session||!ready)return;
  var args=Array.isArray(m.args)?m.args:[];
  try{
   if(m.command==='play')player.playVideo();else if(m.command==='pause'&&!live)player.pauseVideo();
   else if(m.command==='mute')player.mute();else if(m.command==='unmute')player.unMute();
   else if(m.command==='captionsOff')captions();
   else if(m.command==='seek'&&!live&&typeof args[0]==='number'&&isFinite(args[0]))player.seekTo(Math.max(0,args[0]),true);
   else if(m.command==='load'&&validId(args[0]))player.loadVideoById({videoId:args[0],startSeconds:Math.max(0,Number(args[1])||0)});
  }catch(ignore){}
 });
 window.onYouTubeIframeAPIReady=function(){
  player=new YT.Player('player',{width:'100%',height:'100%',videoId:id,playerVars:{autoplay:paused?0:1,playsinline:1,controls:0,disablekb:1,fs:0,cc_load_policy:0,origin:location.origin,widget_referrer:location.href.split('#')[0],start:Math.max(0,Number(p.get('start'))||0)},events:{
   onReady:function(){ready=true;if(p.get('muted')==='1')player.mute();captions();send('ready');if(!paused)player.playVideo();timer=setInterval(tick,1000);},
   onStateChange:function(e){if(e.data===1)captions();if(live&&e.data===2)player.playVideo();tick();send('state',{value:e.data});},
   onError:function(e){send('error',{value:e.data});},onApiChange:function(){captions();send('api');},onAutoplayBlocked:function(){send('blocked');}
  }});
 };
 var script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=function(){send('error',{value:5});};document.head.appendChild(script);
 window.addEventListener('pagehide',function(){clearInterval(timer);});
})();
</script></body></html>
